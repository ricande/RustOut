[package]
name = "rustout"
version = "0.1.0"
edition = "2021"
description = "A small Breakout/Arkanoid-inspired arcade game built with Macroquad"
license = "MIT"
repository = "https://github.com/ricande/RustOut"
readme = "README.md"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
# Optimise dependencies even in debug builds so `cargo run` stays smooth.
opt-level = 2
